<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Sectors 2026 · Auditoria das avaliações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-shim.js"></script>
<style>
:root{--roxo:#2B0A5A;--vermelho:#D8102E;--tinta:#1A1533;--cinza:#6B6880;--linha:#E4E1EC;--leve:#F6F4FA}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--tinta);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select{font:inherit}.topo{display:flex;align-items:flex-start;gap:24px;padding:18px 32px;border-bottom:3px solid var(--roxo)}
.marca{min-width:0}.topo h1{margin:0;color:var(--roxo);font-size:22px;line-height:1.2}.sub{margin-top:4px;color:var(--cinza);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.acoes{display:flex;gap:8px;margin-left:auto}.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 13px;border:1.5px solid var(--roxo);border-radius:4px;background:#fff;color:var(--roxo);font-weight:500;text-decoration:none;cursor:pointer}.btn.pri{background:var(--roxo);color:#fff}
main{padding:20px 32px 42px}.introducao{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}.introducao h2{margin:0 0 3px;color:var(--roxo);font-size:22px}.introducao p{margin:0;color:var(--cinza)}
.filtros{display:grid;grid-template-columns:minmax(220px,1fr) minmax(180px,.8fr) auto;gap:10px;align-items:end;padding:13px;margin-bottom:10px;border:1px solid var(--linha);background:var(--leve)}
.campo label{display:block;margin-bottom:4px;color:var(--cinza);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}.campo select{width:100%;height:38px;padding:0 10px;border:1px solid var(--linha);background:#fff;color:var(--tinta)}
.contagem{margin:0 0 8px;color:var(--cinza);font-size:12px}.planilha{height:calc(100vh - 280px);min-height:320px;overflow:auto;border:1px solid var(--linha)}
table{width:100%;min-width:1430px;border-collapse:separate;border-spacing:0;table-layout:fixed}th,td{height:40px;padding:7px 9px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);vertical-align:middle;text-align:left}th{position:sticky;z-index:3;top:0;background:#E9EBEF;color:#4F4C5D;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;white-space:nowrap}td{background:#fff;font-size:12px}tbody tr:hover td{background:#F8F7FA}
.mono,.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}.num{text-align:center}.data{width:132px}.parecerista{width:160px}.codigo{width:72px}.equipe{width:210px;font-weight:600;text-transform:uppercase}.versao{width:64px}.atual{width:74px}.nota{width:84px}.media{width:98px;background:#F0F1F4!important;font-weight:600}.comentario{width:300px;white-space:normal}.apoio{display:block;color:#8A5E00;font-size:9px;text-transform:uppercase;letter-spacing:.04em}.pill{display:inline-flex;padding:2px 6px;border-radius:999px;background:#E8F4ED;color:#176B43;font-size:10px;font-weight:600}.pill.antiga{background:#EFEDF3;color:#6B6880}
.rodape{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;height:30px;border-top:1px solid #D9D9DE;background:#F0F0F2;color:#77747E;font-size:10px;font-weight:500;letter-spacing:.045em;text-transform:uppercase}
.acesso{max-width:520px;margin:58px auto;padding:28px;border:1px solid var(--linha);box-shadow:0 12px 34px rgba(26,21,51,.09)}.acesso h2{margin:0 0 7px;color:var(--roxo)}.acesso p{color:var(--cinza)}.acesso form{display:flex;gap:8px}.acesso input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--linha)}.erro{min-height:20px;color:var(--vermelho);font-size:12px}
@media(max-width:760px){.topo{padding:14px 16px;flex-wrap:wrap}.acoes{margin-left:0}main{padding:16px}.filtros{grid-template-columns:1fr}.planilha{height:calc(100vh - 360px)}}
</style>
</head>
<body>
<header class="topo"><div class="marca"><h1>Learning Sectors 2026 · Auditoria das avaliações</h1><div class="sub">Registro cronológico de todos os salvamentos</div></div><div class="acoes"><a class="btn" id="voltar" href="#">Voltar ao dashboard</a><button class="btn" id="exportar" type="button" hidden>Exportar CSV</button></div></header>
<main id="raiz"></main>
<footer class="rodape">Mastertech&nbsp; · &nbsp;Processo de avaliação&nbsp; · &nbsp;Learning Sectors 2026</footer>
<script>
const AMBIENTE_LOCAL=["localhost","127.0.0.1"].includes(location.hostname);
const SUPABASE_URL=AMBIENTE_LOCAL?location.origin:"https://sxegrslhumunntjwzcoi.supabase.co";
const SUPABASE_ANON_KEY=AMBIENTE_LOCAL?"local":"sb_publishable_PuIPOJ1YLX90a_Ig7yjEgw_EAJhP8ZH";
const INSCRICOES_PUBLICAS=__DADOS_PUBLICOS__,DADOS_PROTEGIDOS=__DADOS_CRIPTOGRAFADOS__;
const CRITERIOS=[{k:"edi",p:.30},{k:"originalidade",p:.20},{k:"qualidade",p:.20},{k:"viabilidade",p:.15},{k:"impacto",p:.15}];
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const token=new URLSearchParams(location.search).get("token");
let INSCRICOES=[],cliente,todas=[],pareceristas=[],filtroParecerista="",filtroEquipe="";
const media=a=>CRITERIOS.reduce((s,c)=>s+(+a[c.k]||0)*c.p,0),n2=x=>x.toFixed(2).replace(".",","),data=x=>new Date(x).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"medium"});
async function descriptografar(senha){const p=Uint8Array.from(atob(DADOS_PROTEGIDOS),c=>c.charCodeAt(0)),salt=p.slice(0,16),iv=p.slice(16,28),cifrado=p.slice(28),m=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]),k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"]),aberto=await crypto.subtle.decrypt({name:"AES-GCM",iv},k,cifrado);return JSON.parse(new TextDecoder().decode(aberto))}
function acesso(){raiz.innerHTML=`<section class="acesso"><h2>Acesso à auditoria</h2><p>Digite a senha para continuar.</p><form id="form"><input id="senha" type="password" placeholder="Senha de acesso" required><button class="btn pri">Acessar</button></form><div class="erro" id="erro"></div></section>`;$("#form").onsubmit=async e=>{e.preventDefault();try{INSCRICOES=await descriptografar($("#senha").value);await iniciar()}catch{$("#erro").textContent="Senha incorreta."}}}
async function preparar(){if(!AMBIENTE_LOCAL)return acesso();try{INSCRICOES=await fetch("inscricoes.json",{cache:"no-store"}).then(r=>r.json());await iniciar()}catch(e){raiz.innerHTML=`<p>${esc(e.message)}</p>`}}
async function iniciar(){if(!token){raiz.innerHTML="<p>Link administrativo incompleto.</p>";return}cliente=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const v=await cliente.rpc("validar_token",{p_token:token});if(v.error||!v.data||v.data.papel!=="admin"){raiz.innerHTML="<p>Acesso administrativo não reconhecido.</p>";return}const [a,p]=await Promise.all([cliente.rpc("todas_avaliacoes",{p_token:token}),cliente.rpc("listar_avaliadores",{p_token:token})]);if(a.error){raiz.innerHTML=`<p>${esc(a.error.message)}</p>`;return}const tokensOficiais=new Set(["parecerista-1","parecerista-2","parecerista-3"]);pareceristas=(p.data||[]).filter(x=>x.papel==="parecerista"&&x.ativo&&x.contabiliza!==false&&tokensOficiais.has(x.token));const oficiaisIds=new Set(pareceristas.map(x=>x.id));todas=(a.data||[]).filter(x=>oficiaisIds.has(x.avaliador_id)).sort((x,y)=>new Date(x.criado_em)-new Date(y.criado_em));$("#voltar").href=`dashboard.html?token=${encodeURIComponent(token)}`;$("#exportar").hidden=false;render()}
function render(){const equipes=[...INSCRICOES].sort((a,b)=>a.equipe.localeCompare(b.equipe,"pt-BR")),linhas=todas.filter(a=>(!filtroParecerista||a.avaliador_id===filtroParecerista)&&(!filtroEquipe||a.inscricao_id===filtroEquipe));raiz.innerHTML=`<div class="introducao"><div><h2>Planilha de auditoria</h2><p>Cada linha representa um salvamento, do mais antigo para o mais recente.</p></div></div><div class="filtros"><div class="campo"><label for="parecerista">Parecerista</label><select id="parecerista"><option value="">Todos os pareceristas</option>${pareceristas.map(p=>`<option value="${p.id}" ${filtroParecerista===p.id?'selected':''}>${esc(p.nome)}${p.contabiliza===false?' — apoio':''}</option>`).join("")}</select></div><div class="campo"><label for="equipe">Equipe</label><select id="equipe"><option value="">Todas as equipes</option>${equipes.map(i=>`<option value="${i.id}" ${filtroEquipe===i.id?'selected':''}>${esc(i.codigo)} · ${esc(i.equipe)}</option>`).join("")}</select></div><button class="btn" id="limpar">Limpar filtros</button></div><p class="contagem">${linhas.length} ${linhas.length===1?'registro':'registros'} em ordem cronológica</p><div class="planilha"><table><thead><tr><th class="data">Data e hora</th><th class="parecerista">Parecerista</th><th class="codigo">Código</th><th class="equipe">Equipe</th><th class="versao num">Versão</th><th class="atual num">Estado</th><th class="nota num">EDI</th><th class="nota num">Original.</th><th class="nota num">Qualidade</th><th class="nota num">Viabilidade</th><th class="nota num">Impacto</th><th class="media num">Média</th><th class="comentario">Comentário</th></tr></thead><tbody>${linhas.map(linha).join("")}</tbody></table></div>`;$("#parecerista").onchange=e=>{filtroParecerista=e.target.value;render()};$("#equipe").onchange=e=>{filtroEquipe=e.target.value;render()};$("#limpar").onclick=()=>{filtroParecerista=filtroEquipe="";render()}}
function linha(a){const i=INSCRICOES.find(x=>x.id===a.inscricao_id)||{},p=pareceristas.find(x=>x.id===a.avaliador_id)||{};return `<tr><td class="data mono">${data(a.criado_em)}</td><td class="parecerista">${esc(a.avaliador||p.nome||"")}${p.contabiliza===false?'<span class="apoio">apoio · não contabiliza</span>':''}</td><td class="codigo mono">${esc(i.codigo||"")}</td><td class="equipe">${esc(i.equipe||"")}</td><td class="versao num">${a.versao}</td><td class="atual num"><span class="pill ${a.atual?'':'antiga'}">${a.atual?'Atual':'Histórico'}</span></td>${CRITERIOS.map(c=>`<td class="nota num">${n2(+a[c.k])}</td>`).join("")}<td class="media num">${n2(media(a))}</td><td class="comentario">${esc(a.comentario||"—")}</td></tr>`}
function csv(){const linhas=todas.filter(a=>(!filtroParecerista||a.avaliador_id===filtroParecerista)&&(!filtroEquipe||a.inscricao_id===filtroEquipe)),cab=["data_hora","parecerista","contabiliza","codigo","equipe","versao","atual","edi","originalidade","qualidade","viabilidade","impacto","media","comentario"],dados=linhas.map(a=>{const i=INSCRICOES.find(x=>x.id===a.inscricao_id)||{},p=pareceristas.find(x=>x.id===a.avaliador_id)||{};return[a.criado_em,a.avaliador,p.contabiliza===false?'nao':'sim',i.codigo,i.equipe,a.versao,a.atual?'sim':'nao',...CRITERIOS.map(c=>a[c.k]),media(a).toFixed(2),a.comentario||""]}),texto=[cab,...dados].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob(["\ufeff"+texto],{type:"text/csv"}));link.download="auditoria-learning-sectors.csv";link.click()}
$("#exportar").onclick=csv;preparar();
</script>
</body>
</html>
